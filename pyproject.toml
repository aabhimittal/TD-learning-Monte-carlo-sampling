[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rlkit"
version = "0.1.0"
description = "A dependency-light RL teaching library: Monte-Carlo, TD (SARSA/Q-learning), REINFORCE and A2C on grid worlds, built on NumPy only."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abhishek Mittal" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["rlkit*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
