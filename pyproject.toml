[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rlkit"
version = "0.2.0"
description = "A dependency-light RL teaching library: Monte-Carlo, TD (SARSA/Q-learning/n-step/lambda), REINFORCE and A2C on grid worlds and CartPole, built on NumPy only."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abhishek Mittal" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7.0"]
plot = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
include = ["rlkit*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
