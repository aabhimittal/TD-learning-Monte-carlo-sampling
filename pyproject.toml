[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rlkit"
version = "0.3.0"
description = "A dependency-light RL library: Monte-Carlo, TD (SARSA/Q-learning/n-step/lambda/double/expected), offline batch RL, REINFORCE and A2C on grid worlds, CartPole and industrial control tasks -- with schedules, replay, off-policy evaluation and checkpointing, built on NumPy only."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abhishek Mittal" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7.0"]
plot = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
include = ["rlkit*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
